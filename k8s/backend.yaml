
apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskflow-backend
  template:
    metadata:
      labels:
        app: taskflow-backend
    spec:
      containers:
        - name: backend
          image: spoodinnu/taskflow-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: MONGODB_URI
              value: "mongodb://mongodb:27017/taskflow"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:3000,http://localhost:8081"
            - name: JWT_SECRET
              value: "CHANGE_THIS_TO_A_LONG_RANDOM_SECRET_BEFORE_PRODUCTION"

---
apiVersion: v1
kind: Service
metadata:
  name: taskflow-backend
spec:
  selector:
    app: taskflow-backend
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP
