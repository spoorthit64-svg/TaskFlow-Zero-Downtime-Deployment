spring.application.name=taskflow-backend
server.port=${PORT:8080}

# MongoDB Atlas / Cloud connection URI
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/taskflow}
spring.data.mongodb.auto-index-creation=false

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration (comma-separated origins)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://taskflow.vercel.app}

# Logging
logging.level.com.taskflow=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=WARN
